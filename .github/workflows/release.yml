name: Publicar atualização

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  tests:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
        python-version: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  packages:
    needs: tests
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: macos
            asset: Timesheet-CCEE-macOS.zip
          - os: windows-latest
            platform: windows
            asset: Timesheet-CCEE-Windows.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Montar pacote
        run: >-
          python scripts/build_release.py
          --platform "${{ matrix.platform }}"
          --output "dist/${{ matrix.asset }}"
          --repository "${{ github.repository }}"
          --version "${{ github.ref_name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.platform }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: Criar manifesto
        run: >-
          python scripts/create_update_manifest.py
          --repository "${{ github.repository }}"
          --tag "${{ github.ref_name }}"
          --version "${{ github.ref_name }}"
          --macos dist/Timesheet-CCEE-macOS.zip
          --windows dist/Timesheet-CCEE-Windows.zip
          --output dist/update.json
      - name: Publicar GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          dist/Timesheet-CCEE-macOS.zip
          dist/Timesheet-CCEE-Windows.zip
          dist/update.json
          --verify-tag
          --generate-notes
          --title "Timesheet CCEE ${{ github.ref_name }}"
